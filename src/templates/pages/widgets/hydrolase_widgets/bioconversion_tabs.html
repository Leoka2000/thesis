
<div>
    <div class="w-full flex justify-start items-start">
<form id="reactionForm" class="md:w-96 max-w-lg  rounded-lg  border-2 border-neutral-100 shadow-sm p-4" method="get" action="{% url 'hydrolases' %}">
  <div x-data="{ show: true }" x-init="setTimeout(() => show = false, 5000)" x-show="show" class="px-2  pb-2 mx-auto flex justify-center items-center">
    {% if messages %}
    {% for message in messages %}
        <div id="toast-{{ message.tags }}" class="flex items-center w-full max-w-xs p-4 mb-4 text-gray-500 bg-white rounded-lg shadow " role="alert">
            <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg ">
                {% if message.tags == 'success' %}
                    <!-- Success Icon -->
                    <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-green-500 bg-green-100 rounded-lg ">
                        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/>
                        </svg>
                    </div>
                {% elif message.tags == 'error' %}
                    <!-- Error Icon -->
                    <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-red-500 bg-red-100 rounded-lg ">
                        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 11.793a1 1 0 1 1-1.414 1.414L10 11.414l-2.293 2.293a1 1 0 0 1-1.414-1.414L8.586 10 6.293 7.707a1 1 0 0 1 1.414-1.414L10 8.586l2.293-2.293a1 1 0 0 1 1.414 1.414L11.414 10l2.293 2.293Z"/>
                        </svg>
                    </div>
                {% endif %}
            </div>
            <div class="ms-3 text-sm font-normal">{{ message }}</div>
            <button type="button" @click="show = false" class="ms-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 hover:bg-gray-100 inline-flex items-center justify-center h-8 w-8 " aria-label="Close">
                <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1l6 6m0 0l6 6M7 7l6-6M7 7l-6 6"/>
                </svg>
            </button>
        </div>
    {% endfor %}
{% endif %}
</div>
    <label for="pet_polymer" class="block mb-2 text-left text-sm font-medium text-gray-600 ">Select the polymer</label>
    <select id="pet_polymer" name="pet_polymer" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5     ">
      <option selected value="pet_polymer">Pet polymer</option>
    </select>
  <br/>
    <label for="pet_monomer" class="block mb-2  text-sm text-left font-medium text-gray-600 ">Select the monomer</label>
    <select id="pet_monomer" name="pet_monomer" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5     ">
      <option selected value="pet_monomer">Pet monomer</option>
    </select>
      <br/>
    <label for="added_value_molecule" class="block mb-2 text-sm text-left font-medium text-gray-600 ">Select the added value molecule</label>
    <select id="added_value_molecule" name="added_value_molecule" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5     ">
      <option selected value="vanillin">Vanillin</option>
      <option value="1_3_propadienol">1,3-propadienol</option>  
      <option value="cyclic_acetal">cyclic acetal</option>  
      </select>
    <br />
 
    <button type="button" onclick="checkReaction()" class="inline-flex w-full items-center justify-center px-4 py-2 text-sm font-medium tracking-wide text-blue-500 transition-colors duration-100 rounded-md focus:ring-2 focus:ring-offset-2 focus:ring-blue-100 bg-blue-50 hover:text-blue-600 hover:bg-blue-100">
      Show reaction
  </button>

  
  </form>
</div>
  
</div>



  <script>
    function checkReaction() {
      // Get the form element and submit it
      const form = document.getElementById('reactionForm');
      form.submit();
    }
  </script>
